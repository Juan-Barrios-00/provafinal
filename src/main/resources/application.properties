spring.application.name=blog-pessoal
server.port=${PORT:8080}

# Supabase (PostgreSQL). Defina as variaveis de ambiente (veja .env.example)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Token do responsavel pelo blog (necessario para criar, editar e excluir)
app.admin-token=${ADMIN_TOKEN:troque-este-token}

server.error.include-message=never
